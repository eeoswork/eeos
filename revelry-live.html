<!DOCTYPE html>
<html lang="en-US">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>EEOS | Revelry Labs</title>
<link rel="icon" href="/eeos-logo-svg-default.svg" type="image/svg+xml">
<link rel="icon" href="/eeos-logo-png-default.png" type="image/png">
<link rel="icon" href="/eeos-logo-svg-black.svg" type="image/svg+xml" media="(prefers-color-scheme: light)">
<link rel="icon" href="/eeos-logo-png-black.png" type="image/png" media="(prefers-color-scheme: light)">
<link rel="icon" href="/eeos-logo-svg-white.svg" type="image/svg+xml" media="(prefers-color-scheme: dark)">
<link rel="icon" href="/eeos-logo-png-white.png" type="image/png" media="(prefers-color-scheme: dark)">
<link rel="stylesheet" href="assets/tailwind.css" />
<style>
  html, body {
    height: 100%;
    margin: 0;
    font-family: Inter, Helvetica, Arial, sans-serif;
    background: #f1f5f9;
  }
  * { box-sizing: border-box; }
  .eeos-shell {
    display: grid;
    grid-template-columns: 280px 1fr;
    min-height: 100vh;
  }
  .eeos-sidebar {
    border-right: 1px solid #dbe2ea;
    background: #f8fafc;
    padding: 16px 12px 12px;
  }
  .sidebar-block {
    background: #ffffff;
    border: 1px solid #e2e8f0;
    border-radius: 12px;
    padding: 12px;
    margin-bottom: 10px;
  }
  .sidebar-label {
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: #94a3b8;
  }
  .workflow-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px 10px;
    border-radius: 10px;
    font-size: 14px;
    color: #475569;
  }
  .workflow-item.active {
    background: #eef3ff;
    color: #0f172a;
  }
  .workflow-item.locked { color: #94a3b8; }
  .workflow-icon {
    width: 14px;
    height: 14px;
    border-radius: 4px;
    background: #cbd5e1;
    flex-shrink: 0;
  }
  .workflow-item.active .workflow-icon { background: #6366f1; }
  .workflow-check {
    color: #22c55e;
    font-size: 13px;
    font-weight: 700;
    width: 14px;
    text-align: center;
    flex-shrink: 0;
  }
  .main-scroll { overflow-y: auto; }
  .page-wrap {
    max-width: 880px;
    margin: 0 auto;
    padding: 28px 20px 40px;
  }
  .step-card { overflow: hidden; }
  .step-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 16px;
  }
  .step-header.active {
    background: #1e293b;
    border-bottom: 1px solid #334155;
    color: #ffffff;
  }
  .step-body { padding: 16px; }
  .step-body.read-only { color: #94a3b8; }
  .step-message {
    border: 1px solid #e2e8f0;
    background: #f8fafc;
    border-radius: 10px;
    padding: 14px;
    font-size: 14px;
    line-height: 1.55;
    color: #334155;
  }
  .step-message.read-only {
    border-color: #e2e8f0;
    background: #f1f5f9;
    color: #94a3b8;
  }
  .btn {
    border-radius: 8px;
    padding: 10px 14px;
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
  }
  .btn-primary {
    border: 1px solid #334155;
    background: #334155;
    color: #ffffff;
  }
  .btn-secondary {
    border: 1px solid #cbd5e1;
    background: #ffffff;
    color: #334155;
  }
  .complete-pill {
    font-size: 12px;
    font-weight: 500;
    color: #16a34a;
  }
  @media (max-width: 900px) {
    .eeos-shell { grid-template-columns: 1fr; }
    .eeos-sidebar {
      border-right: none;
      border-bottom: 1px solid #dbe2ea;
    }
    .page-wrap {
      padding: 16px;
      max-width: none;
    }
  }
</style>
</head>
<body>
  <div class="eeos-shell">
    <aside class="eeos-sidebar">
      <div class="sidebar-block">
        <img src="eeos-logo-svg-black.svg" alt="EEOS" style="height:18px;width:auto;margin-bottom:8px;" />
        <div class="text-sm font-semibold text-slate-900">Revelry Labs</div>
        <div class="mt-0.5 text-xs text-slate-500">Jennifer Baldwin</div>
      </div>

      <div class="px-2 pt-3">
        <div class="flex items-center justify-between px-1 py-1">
          <span class="sidebar-label">Setup</span>
          <span class="text-sm font-semibold text-emerald-500">✓</span>
        </div>
      </div>

      <div class="px-2 pt-3">
        <div class="px-1 pb-2"><span class="sidebar-label">Event Workflow</span></div>
        <div class="sidebar-block">
          <div class="workflow-item active"><span class="workflow-icon"></span><span>Focus Series</span></div>
          <div class="workflow-item locked"><span class="workflow-icon"></span><span>Run Event</span></div>
          <div class="workflow-item locked"><span class="workflow-icon"></span><span>Review Impact</span></div>
        </div>
      </div>
    </aside>

    <main class="main-scroll">
      <div class="page-wrap">
        <article class="rounded-xl border border-slate-200 bg-white p-5">
          <h4 class="text-base font-semibold text-slate-900">Focus Series</h4>
          <p class="mt-1 text-sm text-slate-600">Use this 3-day async Slack sequence to build team focus and execution momentum.</p>
          <div id="stepsRoot" class="mt-5 space-y-3"></div>
        </article>
      </div>
    </main>
  </div>

<script>
const STORAGE_KEY = "revelryLive.focusSeriesLaunchState";
const FOCUS_SERIES_LAUNCH_STEPS = [
  {
    key: "day_1",
    title: "Day 1 - Start Before You're Ready",
    plainMessage: `🌱 Start Before You're Ready (Async)\n\nWhat have you been putting off because you're not \"ready\" yet?\n\nToday, just start.\n\nHow it works:\n1. Comment what you'll start\n2. Spend 20 minutes making progress\n3. Reply with your result:\n   - ✅ Started\n   - ⚠️ Tried but stuck\n   - ❌ Didn't start\n   + 1 sentence on what happened\n\nBonus: React to 2 others for accountability 👀🔥\n\nWhat are you starting today? 👇`,
    htmlMessage: `🌱 Start Before You're Ready (Async)<br><br>What have you been putting off because you're not &quot;ready&quot; yet?<br><br>Today, just start.<br><br>How it works:<br>1. Comment what you'll start<br>2. Spend 20 minutes making progress<br>3. Reply with your result:<br>&nbsp;&nbsp;&nbsp;- ✅ Started<br>&nbsp;&nbsp;&nbsp;- ⚠️ Tried but stuck<br>&nbsp;&nbsp;&nbsp;- ❌ Didn't start<br>&nbsp;&nbsp;&nbsp;+ 1 sentence on what happened<br><br>Bonus: React to 2 others for accountability 👀🔥<br><br>What are you starting today? 👇`
  },
  {
    key: "day_2",
    title: "Day 2 - One Hard Thing",
    plainMessage: `🧠 One Hard Thing (Async)\n\nWhat's the one thing you've been avoiding?\n\nToday, take it on.\n\nHow it works:\n1. Comment the ONE hard thing you'll tackle\n2. Work on it (aim for at least 30-60 min)\n3. Reply with your result:\n   - ✅ Done\n   - ⚠️ Partial\n   - ❌ Didn't start\n   + 1 sentence on what happened\n\nBonus: React to 2 others for accountability 👀🔥\n\nDrop your hard thing below 👇`,
    htmlMessage: `🧠 One Hard Thing (Async)<br><br>What's the one thing you've been avoiding?<br><br>Today, take it on.<br><br>How it works:<br>1. Comment the ONE hard thing you'll tackle<br>2. Work on it (aim for at least 30-60 min)<br>3. Reply with your result:<br>&nbsp;&nbsp;&nbsp;- ✅ Done<br>&nbsp;&nbsp;&nbsp;- ⚠️ Partial<br>&nbsp;&nbsp;&nbsp;- ❌ Didn't start<br>&nbsp;&nbsp;&nbsp;+ 1 sentence on what happened<br><br>Bonus: React to 2 others for accountability 👀🔥<br><br>Drop your hard thing below 👇`
  },
  {
    key: "day_3",
    title: "Day 3 - Ship Something Today",
    plainMessage: `🚀 Ship Something Today (Async)\n\nToday is about finishing and putting something out into the world-small and imperfect is fine.\n\nHow it works:\n1. Comment what you will ship today\n2. Do the work\n3. Reply with your result:\n   - ✅ Done (share it if you can)\n   - ⚠️ Partial\n   - ❌ Didn't start\n   + 1 sentence on what happened\n\nBonus: React to 2 others for accountability 👀🔥\n\nWhat are you shipping today? 👇`,
    htmlMessage: `🚀 Ship Something Today (Async)<br><br>Today is about finishing and putting something out into the world-small and imperfect is fine.<br><br>How it works:<br>1. Comment what you will ship today<br>2. Do the work<br>3. Reply with your result:<br>&nbsp;&nbsp;&nbsp;- ✅ Done (share it if you can)<br>&nbsp;&nbsp;&nbsp;- ⚠️ Partial<br>&nbsp;&nbsp;&nbsp;- ❌ Didn't start<br>&nbsp;&nbsp;&nbsp;+ 1 sentence on what happened<br><br>Bonus: React to 2 others for accountability 👀🔥<br><br>What are you shipping today? 👇`
  }
];

function readState() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return { activeStepKey: FOCUS_SERIES_LAUNCH_STEPS[0].key, completedStepKeys: [] };
    const parsed = JSON.parse(raw);
    if (!parsed || typeof parsed !== "object") throw new Error("invalid");
    const completedStepKeys = Array.isArray(parsed.completedStepKeys)
      ? parsed.completedStepKeys.map((k) => String(k || ""))
      : [];
    const validKeys = new Set(FOCUS_SERIES_LAUNCH_STEPS.map((step) => step.key));
    const firstIncompleteStep = FOCUS_SERIES_LAUNCH_STEPS.find((step) => !completedStepKeys.includes(step.key)) || null;
    const parsedActiveStepKey = String(parsed.activeStepKey || "");
    const activeStepKey = validKeys.has(parsedActiveStepKey)
      ? parsedActiveStepKey
      : (firstIncompleteStep?.key || "");
    return { activeStepKey, completedStepKeys };
  } catch (_error) {
    return { activeStepKey: FOCUS_SERIES_LAUNCH_STEPS[0].key, completedStepKeys: [] };
  }
}

function writeState(next) {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(next));
}

function getScheduleHintHtml(stepKey) {
  if (stepKey === "day_1") {
    return '<div class="mb-3 flex items-center gap-2 text-sm text-slate-500"><span class="inline-flex h-5 w-5 items-center justify-center rounded-full border border-slate-300 text-xs font-semibold">i</span><span>Schedule this post for today</span></div>';
  }
  if (stepKey === "day_2") {
    return '<div class="mb-3 flex items-center gap-2 text-sm text-slate-500"><span class="inline-flex h-5 w-5 items-center justify-center rounded-full border border-slate-300 text-xs font-semibold">i</span><span>Schedule this post for tomorrow</span></div>';
  }
  if (stepKey === "day_3") {
    return '<div class="mb-3 flex items-center gap-2 text-sm text-slate-500"><span class="inline-flex h-5 w-5 items-center justify-center rounded-full border border-slate-300 text-xs font-semibold">i</span><span>Schedule this post for the next day</span></div>';
  }
  return "";
}

async function copyMessage(step) {
  try {
    if (navigator.clipboard && window.ClipboardItem) {
      await navigator.clipboard.write([
        new ClipboardItem({
          "text/plain": new Blob([step.plainMessage], { type: "text/plain" }),
          "text/html": new Blob([step.htmlMessage], { type: "text/html" })
        })
      ]);
    } else {
      await navigator.clipboard.writeText(step.plainMessage);
    }
    return true;
  } catch (_error) {
    return false;
  }
}

function render() {
  const state = readState();
  const root = document.getElementById("stepsRoot");
  if (!root) return;

  root.innerHTML = FOCUS_SERIES_LAUNCH_STEPS.map((step, index) => {
    const isActive = step.key === state.activeStepKey;
    const isDone = state.completedStepKeys.includes(step.key);
    const isReadOnlyCompleted = isActive && isDone;
    const nextStep = FOCUS_SERIES_LAUNCH_STEPS[index + 1] || null;
    const dayTitleMatch = step.title.match(/^(Day\s+\d+)(.*)$/);
    const dayPrefix = dayTitleMatch ? dayTitleMatch[1] : step.title;
    const daySuffix = dayTitleMatch ? dayTitleMatch[2] : "";
    const advanceLabel = nextStep
      ? `Mark complete and advance to ${nextStep.title}`
      : "I have scheduled all Slack messages for Focus Series";

    return `
      <article class="step-card rounded-xl border ${isActive ? "border-slate-400 shadow-sm" : "border-slate-200"} bg-white">
        <div class="step-header ${isActive ? "active" : ""} cursor-pointer" data-step-header="${step.key}">
          <div class="text-sm ${isActive ? "text-white" : "text-slate-900"}"><span class="font-semibold">${dayPrefix}</span><span class="font-normal">${daySuffix}</span></div>
          ${isDone ? `<span class="complete-pill ${isActive ? "text-emerald-300" : "text-emerald-600"}">✓ Complete</span>` : ""}
        </div>
        ${isActive ? `
          <div class="step-body ${isReadOnlyCompleted ? "read-only" : ""}">
            ${getScheduleHintHtml(step.key)}
            <div class="step-message ${isReadOnlyCompleted ? "read-only" : ""}">${step.htmlMessage}</div>
            <div class="mt-4 flex flex-wrap items-center gap-3">
              <button type="button" class="btn ${isReadOnlyCompleted ? "btn-secondary" : "btn-primary"}" data-copy-step="${step.key}" ${isReadOnlyCompleted ? "disabled" : ""}>Copy message</button>
              <button type="button" class="btn btn-secondary" data-open-slack="true" ${isReadOnlyCompleted ? "disabled" : ""}>Open Slack</button>
            </div>
            ${isReadOnlyCompleted
              ? '<div class="mt-8 text-sm text-slate-400">Completed step. Click any day header to open it. Click this header again to collapse.</div>'
              : `<div class="mt-8"><label class="flex items-center gap-2 text-sm text-slate-700"><input type="checkbox" data-advance-step="${step.key}" class="h-4 w-4 rounded border-slate-300 text-slate-900 focus:ring-slate-400"><span>${advanceLabel}</span></label></div>`}
          </div>
        ` : ""}
      </article>
    `;
  }).join("");

  const stepHeaders = root.querySelectorAll("[data-step-header]");
  if (stepHeaders.length) {
    stepHeaders.forEach((header) => {
      header.addEventListener("click", () => {
        const stepKey = String(header.getAttribute("data-step-header") || "");
        if (!stepKey) return;
        const stateNow = readState();
        const firstIncompleteStep = FOCUS_SERIES_LAUNCH_STEPS.find((step) => !stateNow.completedStepKeys.includes(step.key)) || null;
        const targetIsCompleted = stateNow.completedStepKeys.includes(stepKey);
        const targetIsActive = String(stateNow.activeStepKey || "") === stepKey;
        stateNow.activeStepKey = targetIsActive && targetIsCompleted
          ? (firstIncompleteStep?.key || "")
          : stepKey;
        writeState(stateNow);
        render();
      });
    });
  }

  const copyBtn = root.querySelector("[data-copy-step]");
  if (copyBtn) {
    copyBtn.addEventListener("click", async () => {
      const stepKey = String(copyBtn.getAttribute("data-copy-step") || "");
      const step = FOCUS_SERIES_LAUNCH_STEPS.find((s) => s.key === stepKey);
      if (!step) return;
      const ok = await copyMessage(step);
      const original = copyBtn.textContent;
      copyBtn.textContent = ok ? "✓ Copied" : "Could not copy";
      window.setTimeout(() => { copyBtn.textContent = original; }, 1200);
    });
  }

  const slackBtn = root.querySelector("[data-open-slack]");
  if (slackBtn) {
    slackBtn.addEventListener("click", () => {
      window.open("https://app.slack.com/client/", "_blank", "noopener,noreferrer");
    });
  }

  const advance = root.querySelector("[data-advance-step]");
  if (advance) {
    advance.addEventListener("change", () => {
      if (!advance.checked) return;
      const stepKey = String(advance.getAttribute("data-advance-step") || "");
      const currentIndex = FOCUS_SERIES_LAUNCH_STEPS.findIndex((s) => s.key === stepKey);
      if (currentIndex < 0) return;
      const stateNow = readState();
      if (!stateNow.completedStepKeys.includes(stepKey)) stateNow.completedStepKeys.push(stepKey);
      const next = FOCUS_SERIES_LAUNCH_STEPS[currentIndex + 1] || null;
      if (next) {
        stateNow.activeStepKey = next.key;
        writeState(stateNow);
        render();
        return;
      }
      stateNow.activeStepKey = "";
      writeState(stateNow);
      render();
    });
  }
}

render();
</script>
</body>
</html>
