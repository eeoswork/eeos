<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Brand Sanford, Sexy Realtor to the Motherfucking People</title>
    <style>
      :root {
        --bg: #f8f7f4;
        --text: #1f2937;
        --muted: #5b6473;
        --card: #ffffff;
        --border: #d8dde6;
        --accent: #4e6473;
        --accent-strong: #24323d;
        --radius: 16px;
        --max: 1100px;
      }

      * { box-sizing: border-box; }
      html { scroll-behavior: smooth; }

      body {
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: var(--bg);
        color: var(--text);
        line-height: 1.5;
      }

      .container {
        width: min(100% - 2rem, var(--max));
        margin: 0 auto;
      }

      /* ── header ── */
      .site-header {
        padding: 1rem 0;
        border-bottom: 1px solid var(--border);
        background: var(--card);
      }
      .site-header .container {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 1rem;
      }
      .site-header h1 {
        margin: 0;
        font-size: 1.05rem;
        font-weight: 600;
        color: var(--accent-strong);
      }
      .site-header p {
        margin: 0;
        font-size: 0.8rem;
        color: var(--muted);
      }
      .header-actions { display: flex; gap: 0.5rem; flex-wrap: wrap; }

      /* ── buttons ── */
      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        border-radius: 9999px;
        font-size: 0.8125rem;
        font-weight: 500;
        padding: 0.45rem 1rem;
        cursor: pointer;
        text-decoration: none;
        transition: opacity 0.15s, background 0.15s;
        border: 1px solid transparent;
        white-space: nowrap;
      }
      .btn:disabled { opacity: 0.5; cursor: not-allowed; }
      .btn-primary { background: var(--accent-strong); color: #fff; }
      .btn-primary:not(:disabled):hover { background: var(--accent); }
      .btn-outline { background: var(--card); color: var(--text); border-color: var(--border); }
      .btn-outline:not(:disabled):hover { border-color: var(--accent); color: var(--accent-strong); }

      /* ── main layout ── */
      main { padding: 1.5rem 0 3rem; }
      .layout {
        display: grid;
        gap: 1.5rem;
        grid-template-columns: minmax(0, 1.6fr) minmax(0, 1fr);
        align-items: start;
      }
      @media (max-width: 768px) { .layout { grid-template-columns: 1fr; } }

      /* ── article list ── */
      .section-label {
        font-size: 0.75rem;
        font-weight: 600;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: var(--accent);
        margin: 0 0 0.25rem;
      }
      .section-title {
        font-size: 1.35rem;
        font-weight: 600;
        margin: 0 0 0.25rem;
        color: var(--text);
      }
      .section-title-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 0.75rem;
      }
      .section-title-row .section-title {
        margin: 0;
      }
      .section-sub {
        font-size: 0.8125rem;
        color: var(--muted);
        margin: 0 0 1rem;
      }

      .article-list {
        border: 1px solid var(--border);
        border-radius: var(--radius);
        background: var(--card);
        overflow: hidden;
        box-shadow: 0 4px 20px rgba(31,41,55,0.05);
      }

      .article-row {
        display: flex;
        align-items: center;
        gap: 0.75rem;
        padding: 0.65rem 0.9rem;
        border-bottom: 1px solid var(--border);
        cursor: pointer;
        transition: background 0.12s;
        user-select: none;
      }
      .article-row:last-child { border-bottom: none; }
      .article-row:hover { background: #f2f4f7; }
      .article-row.selected { background: rgba(78,100,115,0.06); }

      .article-row-body { flex: 1; min-width: 0; }
      .article-row-title {
        font-size: 0.8125rem;
        font-weight: 600;
        color: var(--text);
        line-height: 1.35;
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
      }
      .article-row-meta {
        font-size: 0.72rem;
        color: var(--muted);
        margin-top: 0.15rem;
      }

      .article-row-actions {
        display: flex;
        align-items: center;
        gap: 0.5rem;
        flex-shrink: 0;
      }
      .badge {
        font-size: 0.7rem;
        font-weight: 600;
        padding: 0.2rem 0.55rem;
        border-radius: 9999px;
        white-space: nowrap;
      }
      .badge-idle { background: rgba(78,100,115,0.1); color: var(--accent-strong); }
      .badge-selected { background: var(--accent-strong); color: #fff; }
      .badge-loading { background: rgba(78,100,115,0.1); color: var(--accent-strong); }
      .link-icon {
        color: var(--muted);
        text-decoration: none;
        line-height: 0;
        transition: color 0.12s;
      }
      .link-icon:hover { color: var(--text); }

      /* ── status messages ── */
      .msg {
        padding: 0.85rem 1rem;
        border-radius: var(--radius);
        font-size: 0.8125rem;
        border: 1px dashed var(--border);
        color: var(--muted);
        background: var(--card);
      }
      .msg-error {
        border-color: #f0c0c0;
        background: #fff5f5;
        color: #b91c1c;
        border-style: solid;
      }

      /* ── draft panel ── */
      .draft-panel {
        border: 1px solid var(--border);
        border-radius: var(--radius);
        background: var(--card);
        padding: 1.1rem 1.2rem;
        box-shadow: 0 4px 20px rgba(31,41,55,0.05);
        position: sticky;
        top: 1.25rem;
      }
      .draft-panel-header {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 0.75rem;
        margin-bottom: 1rem;
      }
      .draft-panel h2 {
        font-size: 1.1rem;
        font-weight: 600;
        margin: 0;
        color: var(--text);
      }

      .draft-block {
        background: var(--bg);
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 0.75rem 0.9rem;
        margin-bottom: 0.65rem;
      }
      .draft-block-label {
        font-size: 0.68rem;
        font-weight: 600;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: var(--accent);
        margin-bottom: 0.35rem;
      }
      .draft-block-text {
        font-size: 0.8rem;
        color: var(--text);
        line-height: 1.55;
        white-space: pre-wrap;
        word-break: break-word;
      }

      .draft-actions { display: flex; flex-wrap: wrap; gap: 0.5rem; margin-top: 0.9rem; }

      .empty-draft {
        padding: 1.5rem 0.5rem;
        font-size: 0.8125rem;
        color: var(--muted);
        text-align: center;
      }

      .disclaimer {
        font-size: 0.73rem;
        color: var(--muted);
        background: var(--bg);
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 0.6rem 0.8rem;
        line-height: 1.5;
        margin-top: 0.65rem;
      }

      /* ── spinner ── */
      @keyframes spin { to { transform: rotate(360deg); } }
      .spinner {
        width: 14px; height: 14px;
        border: 2px solid rgba(78,100,115,0.25);
        border-top-color: var(--accent);
        border-radius: 50%;
        animation: spin 0.7s linear infinite;
        display: inline-block;
        vertical-align: middle;
      }
    </style>
  </head>
  <body>

    <header class="site-header">
      <div class="container">
        <div>
          <h1>Brand Sanford, Sexy Realtor to the Motherfucking People</h1>
          <p>LA real estate news &rarr; Facebook post</p>
        </div>
      </div>
    </header>

    <main>
      <div class="container">
        <div class="layout">

          <!-- Articles -->
          <section>
            <p class="section-label">Latest Articles</p>
            <div class="section-title-row">
              <h2 class="section-title">Los Angeles Real Estate News</h2>
              <button class="btn btn-outline" id="refresh-btn" onclick="loadArticles()">Refresh feed</button>
            </div>
            <p class="section-sub">Click any article to generate a Facebook draft.</p>

            <div id="articles-status"></div>
            <div id="article-list" class="article-list" style="display:none"></div>
          </section>

          <!-- Draft Panel -->
          <aside class="draft-panel" id="draft-panel">
            <div class="draft-panel-header">
              <div>
                <p class="section-label">Draft</p>
                <h2>Facebook Draft</h2>
              </div>
            </div>

            <div id="draft-content">
              <div class="empty-draft">Select an article to generate a draft.</div>
            </div>
          </aside>

        </div>
      </div>
    </main>

    <script>
      const API_BASE = 'https://brandon.eeos.work/api/brandon';

      let selectedArticleId = null;
      let generatingId = null;
      let articles = [];

      function relativeTime(iso) {
        const ms = Date.now() - new Date(iso).getTime();
        const m = Math.floor(ms / 60000);
        if (m < 1) return 'just now';
        if (m < 60) return m + ' min ago';
        const h = Math.floor(m / 60);
        if (h < 24) return h + ' hr ago';
        return Math.floor(h / 24) + 'd ago';
      }

      function setStatus(html, isError = false) {
        const el = document.getElementById('articles-status');
        el.innerHTML = html
          ? `<div class="msg${isError ? ' msg-error' : ''}">${html}</div>`
          : '';
      }

      function renderList() {
        const list = document.getElementById('article-list');
        if (!articles.length) { list.style.display = 'none'; return; }
        list.style.display = 'block';
        list.innerHTML = articles.map(a => {
          const isSelected = a.id === selectedArticleId;
          const isGenerating = a.id === generatingId;
          let badge = '';
          if (isGenerating) {
            badge = `<span class="badge badge-loading"><span class="spinner"></span></span>`;
          } else if (isSelected) {
            badge = `<span class="badge badge-selected">Selected</span>`;
          } else {
            badge = `<span class="badge badge-idle">Draft</span>`;
          }
          return `
            <div class="article-row${isSelected ? ' selected' : ''}" onclick="handleSelect('${a.id}')" tabindex="0" role="button" aria-label="Create Facebook post for ${a.title.replace(/"/g, '&quot;')}">
              <div class="article-row-body">
                <div class="article-row-title">${a.title}</div>
                <div class="article-row-meta">${a.source} · ${relativeTime(a.publishedAt)}</div>
              </div>
              <div class="article-row-actions">
                ${badge}
                <a class="link-icon" href="${a.url}" target="_blank" rel="noopener noreferrer" onclick="event.stopPropagation()" title="Open article">
                  <svg xmlns="http://www.w3.org/2000/svg" width="13" height="13" viewBox="0 0 16 16" fill="currentColor">
                    <path d="M6.22 8.72a.75.75 0 0 0 1.06 1.06l5.22-5.22v1.69a.75.75 0 0 0 1.5 0v-3.5a.75.75 0 0 0-.75-.75h-3.5a.75.75 0 0 0 0 1.5h1.69L6.22 8.72Z"/>
                    <path d="M3.5 6.75c0-.69.56-1.25 1.25-1.25H7A.75.75 0 0 0 7 4H4.75A2.75 2.75 0 0 0 2 6.75v4.5A2.75 2.75 0 0 0 4.75 14h4.5A2.75 2.75 0 0 0 12 11.25V9a.75.75 0 0 0-1.5 0v2.25c0 .69-.56 1.25-1.25 1.25h-4.5c-.69 0-1.25-.56-1.25-1.25v-4.5Z"/>
                  </svg>
                </a>
              </div>
            </div>`;
        }).join('');

        // keyboard support
        list.querySelectorAll('.article-row').forEach(row => {
          row.addEventListener('keydown', e => {
            if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); row.click(); }
          });
        });
      }

      async function loadArticles() {
        const btn = document.getElementById('refresh-btn');
        btn.disabled = true;
        btn.textContent = 'Loading…';
        setStatus('Loading articles…');
        document.getElementById('article-list').style.display = 'none';

        try {
          const res = await fetch(`${API_BASE}/articles`);
          if (!res.ok) throw new Error('Failed to load articles');
          const data = await res.json();
          articles = data.ok ? data.data : [];
          setStatus('');
          if (!articles.length) setStatus('No articles found right now. Try refreshing.');
          renderList();
        } catch (err) {
          setStatus('Couldn\'t load articles right now. Try refreshing in a minute.', true);
        } finally {
          btn.disabled = false;
          btn.textContent = 'Refresh feed';
        }
      }

      async function handleSelect(id) {
        if (generatingId) return;
        const article = articles.find(a => a.id === id);
        if (!article) return;

        selectedArticleId = id;
        generatingId = id;
        renderList();
        showDraftLoading(article);
        scrollToDraftOnSmallScreens();

        try {
          const res = await fetch(`${API_BASE}/generate`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ article })
          });
          const data = await res.json();
          if (!res.ok || !data.ok) {
            throw new Error(data?.error?.message || 'Failed to generate draft. Try another article.');
          }
          showDraft(article, data.data);
        } catch (err) {
          showDraftError(err.message || 'Something went wrong. Try again.');
        } finally {
          generatingId = null;
          renderList();
        }
      }

      function scrollToDraftOnSmallScreens() {
        if (!window.matchMedia('(max-width: 768px)').matches) return;
        const panel = document.getElementById('draft-panel');
        if (!panel) return;
        panel.scrollIntoView({ behavior: 'smooth', block: 'start' });
      }

      function showDraftLoading(article) {
        document.getElementById('draft-content').innerHTML = `
          <div class="draft-block">
            <div class="draft-block-label">Selected Article</div>
            <div class="draft-block-text" style="font-weight:600">${article.title}</div>
            <div style="font-size:0.72rem;color:var(--muted);margin-top:0.25rem">${article.source}</div>
          </div>
          <div class="msg" style="margin-top:0.5rem"><span class="spinner"></span>&nbsp; Generating Facebook draft…</div>
        `;
      }

      function showDraftError(msg) {
        document.getElementById('draft-content').innerHTML = `
          <div class="msg msg-error">${msg}</div>
          <div class="empty-draft" style="padding-top:0.75rem">Select a different article to try again.</div>
        `;
      }

      let copiedTimeout = null;
      function showDraft(article, draft) {
        const fullPost = `${draft.summary}\n\n${article.url}`;

        document.getElementById('draft-content').innerHTML = `
          <div class="draft-block">
            <div class="draft-block-label">Full Post</div>
            <div class="draft-block-text" id="full-post-text">${fullPost.replace(/</g,'&lt;').replace(/>/g,'&gt;')}</div>
          </div>
          <div class="draft-actions">
            <button class="btn btn-primary" id="copy-btn" data-copy-text="${fullPost.replace(/"/g, '&quot;')}" onclick="copyPost()">Copy Post</button>
            <a class="btn btn-outline" href="https://www.facebook.com/" target="_blank" rel="noopener noreferrer">Open Facebook</a>
          </div>
        `;
      }

      async function copyPost() {
        const btn = document.getElementById('copy-btn');
        const text = btn.getAttribute('data-copy-text');
        try {
          await navigator.clipboard.writeText(text);
          if (btn) {
            btn.textContent = 'Copied!';
            clearTimeout(copiedTimeout);
            copiedTimeout = setTimeout(() => { if (btn) btn.textContent = 'Copy Post'; }, 1800);
          }
        } catch (_) {
          alert('Copy failed — select the post text manually.');
        }
      }

      // Load on page open
      loadArticles();
    </script>
  </body>
</html>
