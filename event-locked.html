<!DOCTYPE html>
<html lang="en-US">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Event Access</title>
  <link rel="stylesheet" href="assets/styles.css" />
  <script src="config.js"></script>
  <style>
    :root {
      --bg: #f5f7fb;
      --card: #ffffff;
      --text: #10233f;
      --muted: #5f6f86;
      --line: #dbe2ee;
      --accent: #146ef5;
      --ok: #127a4a;
      --err: #b42318;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: "IBM Plex Sans", "Segoe UI", Arial, sans-serif;
      background: linear-gradient(180deg, #f8fbff 0%, var(--bg) 40%, #eef2f8 100%);
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 12px;
    }

    .wrap {
      max-width: 600px;
      width: 100%;
    }

    .panel {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 32px;
      box-shadow: 0 8px 24px rgba(16, 35, 63, 0.05);
      text-align: center;
    }

    h1 {
      margin: 0 0 12px;
      font-size: 24px;
      letter-spacing: -0.02em;
    }

    .subtitle {
      color: var(--muted);
      font-size: 14px;
      margin-bottom: 24px;
    }

    .status {
      padding: 16px 12px;
      border-radius: 8px;
      font-size: 14px;
      line-height: 1.6;
      margin-bottom: 24px;
    }

    .status.loading {
      background: #eaf2ff;
      color: #1a57be;
    }

    .status.ok {
      background: #dcfce7;
      color: var(--ok);
    }

    .status.err {
      background: #fee2e2;
      color: var(--err);
    }

    .content {
      text-align: left;
      line-height: 1.8;
      color: var(--text);
      background: #fcfdff;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 20px;
      margin-bottom: 24px;
      display: none;
    }

    .content.active {
      display: block;
    }

    .content h2 {
      margin: 0 0 12px;
      font-size: 18px;
    }

    .meta {
      font-size: 12px;
      color: var(--muted);
      margin-top: 16px;
      padding-top: 16px;
      border-top: 1px solid var(--line);
    }

    button {
      border: 0;
      border-radius: 8px;
      padding: 12px 20px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      background: var(--accent);
      color: #fff;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .spinner {
      display: inline-block;
      width: 16px;
      height: 16px;
      border: 2px solid rgba(26, 87, 190, 0.3);
      border-top-color: #1a57be;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="panel">
      <h1 id="title">Event Access</h1>
      <div class="subtitle" id="subtitle">Verifying your access...</div>

      <div class="status loading" id="status">
        <div class="spinner"></div> Loading event...
      </div>

      <div class="content active" id="content">
        <h2>Week <span id="weekNumber">1</span> Event</h2>
        <p id="eventDescription">
          Your event is ready to launch. This link is time-locked for 7 days from when you first accessed it.
        </p>
        <p>
          Complete your event, and when you're ready, you can launch the next week's event.
        </p>

        <div class="meta">
          <div>Access expires: <strong id="expiresAt">-</strong></div>
          <div>Event ID: <strong id="eventId">-</strong></div>
        </div>
      </div>

      <div class="status err" id="error" style="display: none;"></div>
    </div>
  </div>

  <script>
    const APP_CONFIG = window.__EEOS_CONFIG__ || {};
    const API_BASE = String(APP_CONFIG.apiBaseUrl || "https://esos-polls.ajolly2.workers.dev/api").replace(/\/+$/, "");

    async function validateToken() {
      const url = new URL(window.location);
      const token = String(url.searchParams.get("token") || "").trim();

      if (!token) {
        showError("No access token provided. Check your link.");
        return;
      }

      try {
        const response = await fetch(`${API_BASE}/event/validate?token=${encodeURIComponent(token)}`, {
          method: "GET",
          headers: { "Accept": "application/json" }
        });

        const payload = await response.json();

        if (!response.ok || !payload?.ok) {
          const message = payload?.error?.message || "Invalid or expired token.";
          showError(message);
          return;
        }

        const data = payload.data || {};
        showSuccess(data);
      } catch (error) {
        showError("Failed to validate access: " + (error.message || "Unknown error"));
      }
    }

    function showError(message) {
      const status = document.getElementById("status");
      const error = document.getElementById("error");
      const content = document.getElementById("content");

      status.style.display = "none";
      content.classList.remove("active");

      error.classList.remove("loading");
      error.classList.add("err");
      error.textContent = message;
      error.style.display = "block";

      document.getElementById("title").textContent = "Access Denied";
      document.getElementById("subtitle").textContent = "We couldn't verify your event access.";
    }

    function showSuccess(data) {
      const status = document.getElementById("status");
      const error = document.getElementById("error");
      const content = document.getElementById("content");

      status.style.display = "none";
      error.style.display = "none";

      const weekNumber = Number(data.weekNumber || 1);
      const eventId = String(data.eventId || "-");
      const expiresAt = String(data.expiresAt || "-");

      document.getElementById("weekNumber").textContent = weekNumber;
      document.getElementById("eventId").textContent = eventId;
      document.getElementById("expiresAt").textContent = formatDate(expiresAt);

      content.classList.add("active");
      document.getElementById("title").textContent = `Week ${weekNumber} Event`;
      document.getElementById("subtitle").textContent = "Your event is ready to go.";
    }

    function formatDate(iso) {
      if (!iso) return "-";
      const d = new Date(iso);
      if (Number.isNaN(d.getTime())) return iso;
      return d.toLocaleDateString() + " at " + d.toLocaleTimeString();
    }

    validateToken();
  </script>
</body>
</html>
