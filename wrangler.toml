name = "eeos-api"
main = "cloudflare/worker.js"
compatibility_date = "2026-03-09"

routes = [
	{ pattern = "eeos.work/*", zone_name = "eeos.work" },
	{ pattern = "api.eeos.work/api/*", zone_name = "eeos.work" },
	{ pattern = "api.eeos.work/*", zone_name = "eeos.work" },
	{ pattern = "revelrylabs.eeos.work/api/*", zone_name = "eeos.work" },
	{ pattern = "revelrylabs.eeos.work/*", zone_name = "eeos.work" },
	{ pattern = "avery.eeos.work/api/*", zone_name = "eeos.work" },
	{ pattern = "avery.eeos.work/*", zone_name = "eeos.work" },
	{ pattern = "neel.eeos.work/api/*", zone_name = "eeos.work" },
	{ pattern = "neel.eeos.work/*", zone_name = "eeos.work" },
	{ pattern = "susco.eeos.work/api/*", zone_name = "eeos.work" },
	{ pattern = "susco.eeos.work/*", zone_name = "eeos.work" },
	{ pattern = "todo.eeos.work/*", zone_name = "eeos.work" },
	{ pattern = "ops.eeos.work/*", zone_name = "eeos.work" }
]

[vars]
POLL_UPSTREAM_BASE = "https://esos-polls.ajolly2.workers.dev/api"
NOTIFY_EMAIL = "avery@eeos.work"
FROM_EMAIL = "no-reply@eeos.work"

[[d1_databases]]
binding = "DB"
database_name = "eeos"
database_id = "b2aae14e-2569-41c3-b670-84e2029e1a7e"
