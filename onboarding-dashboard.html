<!DOCTYPE html>
<html lang="en-US">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Onboarding Dashboard</title>
  <style>
    :root {
      --bg: #f5f7fb;
      --card: #ffffff;
      --text: #10233f;
      --muted: #5f6f86;
      --line: #dbe2ee;
      --accent: #146ef5;
      --ok: #127a4a;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: "IBM Plex Sans", "Segoe UI", Arial, sans-serif;
      background: linear-gradient(180deg, #f8fbff 0%, var(--bg) 40%, #eef2f8 100%);
      color: var(--text);
    }

    .wrap {
      max-width: 1200px;
      margin: 0 auto;
      padding: 24px;
    }

    .top {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: end;
      gap: 12px;
      margin-bottom: 16px;
    }

    h1 {
      margin: 0;
      font-size: 28px;
      letter-spacing: -0.02em;
    }

    .meta {
      color: var(--muted);
      font-size: 13px;
    }

    .panel {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 14px;
      box-shadow: 0 8px 24px rgba(16, 35, 63, 0.05);
    }

    .controls {
      display: grid;
      grid-template-columns: 1.2fr 0.8fr auto auto auto;
      gap: 10px;
      align-items: end;
      margin-bottom: 14px;
    }

    .field label {
      display: block;
      font-size: 12px;
      color: var(--muted);
      margin-bottom: 4px;
    }

    .field input,
    .field select {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 9px 10px;
      font-size: 14px;
      background: #fff;
    }

    button {
      border: 0;
      border-radius: 8px;
      padding: 10px 14px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      background: var(--accent);
      color: #fff;
    }

    button.ghost {
      background: #eaf2ff;
      color: #1a57be;
    }

    button.danger {
      background: #fff1f2;
      color: #b42318;
      border: 1px solid #fecdd3;
    }

    button:disabled {
      cursor: not-allowed;
      opacity: 0.6;
    }

    .status {
      font-size: 13px;
      margin: 8px 2px 2px;
      color: var(--muted);
      min-height: 18px;
    }

    .status.ok { color: var(--ok); }
    .status.err { color: #b42318; }

    .list {
      display: grid;
      gap: 12px;
      margin-top: 14px;
    }

    .card {
      border: 1px solid var(--line);
      border-radius: 12px;
      background: #fff;
      overflow: hidden;
    }

    .cardHead {
      padding: 12px 14px;
      background: #f2f7ff;
      border-bottom: 1px solid var(--line);
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      gap: 8px;
    }

    .email {
      font-weight: 700;
      word-break: break-all;
    }

    .small {
      color: var(--muted);
      font-size: 12px;
    }

    .headActions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .grid {
      padding: 12px 14px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
    }

    .box {
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 10px;
      background: #fcfdff;
    }

    .box h3 {
      margin: 0 0 8px;
      font-size: 13px;
      text-transform: uppercase;
      letter-spacing: 0.03em;
      color: #3a4b67;
    }

    .row {
      display: grid;
      grid-template-columns: 130px 1fr;
      gap: 8px;
      margin-bottom: 6px;
      font-size: 13px;
    }

    .key { color: var(--muted); }
    .val { color: var(--text); word-break: break-word; }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }

    th, td {
      border-bottom: 1px solid var(--line);
      text-align: left;
      padding: 6px 4px;
    }

    th { color: var(--muted); font-weight: 600; }

    .linkBlock {
      display: grid;
      gap: 8px;
    }

    .linkUrl {
      display: block;
      width: 100%;
      padding: 9px 10px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
      color: var(--text);
      font-size: 12px;
      text-decoration: none;
      word-break: break-all;
    }

    .linkMeta {
      font-size: 12px;
      color: var(--muted);
      line-height: 1.5;
    }

    .actionsRow {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      border-radius: 999px;
      padding: 3px 8px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.01em;
      text-transform: uppercase;
    }

    .badge.ok {
      color: #0f6b45;
      background: #e8fbf0;
      border: 1px solid #b6f0cb;
    }

    .badge.warn {
      color: #8a5a00;
      background: #fff8e5;
      border: 1px solid #fde39a;
    }

    .badge.muted {
      color: #4a5a73;
      background: #eef2f8;
      border: 1px solid #d7deea;
    }

    .empty {
      padding: 14px;
      font-size: 13px;
      color: var(--muted);
    }

    @media (max-width: 980px) {
      .controls { grid-template-columns: 1fr; }
      .grid { grid-template-columns: 1fr; }
    }

    @media (max-width: 640px) {
      .wrap {
        padding: 12px;
      }

      h1 {
        font-size: 24px;
      }

      .panel,
      .cardHead,
      .grid {
        padding-left: 10px;
        padding-right: 10px;
      }

      .row {
        grid-template-columns: 1fr;
        gap: 2px;
      }

      .actionsRow {
        display: grid;
        grid-template-columns: 1fr;
      }

      .box {
        overflow-x: auto;
      }

      table {
        min-width: 520px;
      }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="top">
      <div>
        <h1>Onboarding Dashboard</h1>
        <div class="meta">Simple read-only view for onboarding answers and recommended program weeks</div>
      </div>
      <div class="meta" id="fetchedAt">Not loaded yet</div>
    </div>

    <div class="panel">
      <div class="controls">
        <div class="field">
          <label for="apiBase">API Base URL</label>
          <input id="apiBase" type="text" value="https://api.eeos.work/api" />
        </div>
        <div class="field">
          <label for="readKey">Dashboard Read Key</label>
          <input id="readKey" type="password" placeholder="Set in Cloudflare as DASHBOARD_READ_KEY" />
        </div>
        <div class="field">
          <label for="limit">Rows</label>
          <input id="limit" type="number" min="1" max="100" value="25" />
        </div>
        <div class="field">
          <label for="accountFilter">Account type</label>
          <select id="accountFilter">
            <option value="all">All accounts</option>
            <option value="email_only">Email only</option>
            <option value="registered">Registered</option>
          </select>
        </div>
        <button id="loadBtn" type="button">Load</button>
      </div>
      <button class="ghost" id="refreshBtn" type="button">Refresh</button>
      <button class="ghost" id="resyncBtn" type="button" style="margin-left:8px">Resync progress data</button>
      <div class="status" id="status"></div>
    </div>

    <div class="list" id="results"></div>
  </div>

  <script>
    const refs = {
      apiBase: document.getElementById("apiBase"),
      readKey: document.getElementById("readKey"),
      limit: document.getElementById("limit"),
      accountFilter: document.getElementById("accountFilter"),
      loadBtn: document.getElementById("loadBtn"),
      refreshBtn: document.getElementById("refreshBtn"),
      resyncBtn: document.getElementById("resyncBtn"),
      status: document.getElementById("status"),
      results: document.getElementById("results"),
      fetchedAt: document.getElementById("fetchedAt")
    };

    let allUsers = [];

    function setStatus(message, type) {
      refs.status.className = "status" + (type ? " " + type : "");
      refs.status.textContent = message;
    }

    function formatArray(value) {
      if (!Array.isArray(value) || !value.length) return "-";
      return value.join(", ");
    }

    function formatCurrency(value) {
      const amount = Number(value || 0);
      if (!amount) return "-";
      return "$" + amount.toLocaleString();
    }

    function formatDate(value) {
      const iso = String(value || "").trim();
      if (!iso) return "-";
      const d = new Date(iso);
      if (Number.isNaN(d.getTime())) return iso;
      return d.toLocaleString();
    }

    function formatProgressStatus(status) {
      const normalized = String(status || "").trim().toLowerCase();
      if (normalized === "complete") {
        return { label: "Complete", className: "ok" };
      }
      if (normalized === "in_progress") {
        return { label: "In progress", className: "warn" };
      }
      return { label: "Not started", className: "muted" };
    }

    function getFilteredUsers() {
      const filter = String(refs.accountFilter?.value || "all").trim().toLowerCase();
      if (filter !== "email_only" && filter !== "registered") {
        return [...allUsers];
      }
      return allUsers.filter((user) => String(user?.progress?.accountState || "").trim().toLowerCase() === filter);
    }

    function renderFilteredUsers() {
      const filteredUsers = getFilteredUsers();
      render(filteredUsers);
      const filter = String(refs.accountFilter?.value || "all").trim().toLowerCase();
      const label = filter === "email_only"
        ? "email-only"
        : filter === "registered"
          ? "registered"
          : "all";
      setStatus(`Showing ${filteredUsers.length} of ${allUsers.length} user record(s) (${label}).`, "ok");
    }

    function render(users) {
      refs.results.innerHTML = "";
      if (!Array.isArray(users) || !users.length) {
        refs.results.innerHTML = '<div class="panel empty">No rows found.</div>';
        return;
      }

      for (const user of users) {
        const card = document.createElement("article");
        card.className = "card";

        const answers = user.answers || {};
        const program = Array.isArray(user.program) ? user.program : [];
        const magicLink = user.magicLink || null;
        const progress = user.progress || {};
        const progressWeeks = Array.isArray(progress.weeks) ? progress.weeks : [];
        const accountStateLabel = String(progress.accountState || "") === "email_only" ? "Email only" : "Registered";

        card.innerHTML = `
          <div class="cardHead">
            <div>
              <div class="email">${escapeHtml(user.email || "-")}</div>
              <div class="small">Company: ${escapeHtml(user.companyName || "-")} | Admin: ${escapeHtml(user.adminName || "-")} | Account: ${escapeHtml(accountStateLabel)}</div>
            </div>
            <div class="headActions">
              <div class="small">Updated: ${escapeHtml(formatDate(user.updatedAt))}</div>
              <button class="danger delete-account-btn" type="button" data-email="${escapeHtml(user.email || "")}" data-company-id="${escapeHtml(user.companyId || "")}">Delete account</button>
            </div>
          </div>
          <div class="grid">
            <section class="box">
              <h3>User Inputs</h3>
              <div class="row"><div class="key">Employees</div><div class="val">${escapeHtml(String(answers.employeeCount || "-"))}</div></div>
              <div class="row"><div class="key">Goals</div><div class="val">${escapeHtml(formatArray(answers.goals))}</div></div>
              <div class="row"><div class="key">Setting</div><div class="val">${escapeHtml(answers.setting || "-")}</div></div>
              <div class="row"><div class="key">Schedule</div><div class="val">${escapeHtml(formatArray(answers.schedule))}</div></div>
              <div class="row"><div class="key">City</div><div class="val">${escapeHtml(answers.localCity || "-")}</div></div>
              <div class="row"><div class="key">Days</div><div class="val">${escapeHtml(formatArray(answers.daysSelected))}</div></div>
              <div class="row"><div class="key">Times</div><div class="val">${escapeHtml(formatArray(answers.timesSelected))}</div></div>
              <div class="row"><div class="key">Interests</div><div class="val">${escapeHtml(formatArray(answers.interests))}</div></div>
              <div class="row"><div class="key">Budget mode</div><div class="val">${escapeHtml(answers.budgetMode || "-")}</div></div>
              <div class="row"><div class="key">Total budget</div><div class="val">${escapeHtml(formatCurrency(answers.totalBudget))}</div></div>
              <div class="row"><div class="key">Per employee</div><div class="val">${escapeHtml(formatCurrency(answers.perEmployeeBudget))}</div></div>
            </section>
            <section class="box">
              <h3>Program Progress</h3>
              ${progress.totalWeeks ? `
                <div class="row"><div class="key">Current week</div><div class="val">${escapeHtml(String(progress.currentWeek || "-"))}</div></div>
                <div class="row"><div class="key">Current stage</div><div class="val">${escapeHtml(progress.currentStage || "-")}</div></div>
                <div class="row"><div class="key">Completed</div><div class="val">${escapeHtml(String(progress.completedWeeks || 0))} / ${escapeHtml(String(progress.totalWeeks || 0))}</div></div>
                <table>
                  <thead><tr><th>Week</th><th>Event</th><th>Stage</th><th>Status</th></tr></thead>
                  <tbody>
                    ${progressWeeks.map((item) => {
                      const status = formatProgressStatus(item.status);
                      return `<tr>
                        <td>${escapeHtml(String(item.week || "-"))}</td>
                        <td>${escapeHtml(item.eventName || "-")}</td>
                        <td>${escapeHtml(item.stageLabel || "-")}</td>
                        <td><span class="badge ${escapeHtml(status.className)}">${escapeHtml(status.label)}</span></td>
                      </tr>`;
                    }).join("")}
                  </tbody>
                </table>
              ` : '<div class="small">No program progress found yet.</div>'}
              <div style="height:10px"></div>
              <h3>Recommended Program</h3>
              ${program.length ? `
                <table>
                  <thead><tr><th>Week</th><th>Event name</th></tr></thead>
                  <tbody>
                    ${program.map((item) => `<tr><td>${escapeHtml(String(item.week || "-"))}</td><td>${escapeHtml(item.eventName || "-")}</td></tr>`).join("")}
                  </tbody>
                </table>
              ` : '<div class="small">No saved program rows.</div>'}
              <div style="height:10px"></div>
              <h3>Latest Magic Link</h3>
              ${magicLink?.url ? `
                <div class="linkBlock">
                  <a class="linkUrl" href="${escapeHtml(magicLink.url)}" target="_blank" rel="noopener noreferrer">${escapeHtml(magicLink.url)}</a>
                  <div class="actionsRow">
                    <button class="ghost copy-link-btn" type="button" data-link="${escapeHtml(magicLink.url)}">Copy link</button>
                  </div>
                  <div class="linkMeta">
                    Created: ${escapeHtml(formatDate(magicLink.createdAt))}<br>
                    Expires: ${escapeHtml(formatDate(magicLink.expiresAt))}<br>
                    Used: ${escapeHtml(magicLink.usedAt ? formatDate(magicLink.usedAt) : "Not used yet")}
                  </div>
                </div>
              ` : '<div class="small">No magic link found for this account.</div>'}
            </section>
          </div>
        `;

        refs.results.appendChild(card);
      }

      for (const button of refs.results.querySelectorAll(".delete-account-btn")) {
        button.addEventListener("click", () => {
          const email = String(button.getAttribute("data-email") || "").trim();
          const companyId = String(button.getAttribute("data-company-id") || "").trim();
          deleteAccount({ email, companyId, button });
        });
      }

      for (const button of refs.results.querySelectorAll(".copy-link-btn")) {
        button.addEventListener("click", async () => {
          const link = String(button.getAttribute("data-link") || "").trim();
          if (!link) return;
          try {
            await navigator.clipboard.writeText(link);
            setStatus("Magic link copied.", "ok");
          } catch (_error) {
            setStatus("Could not copy link. You can still open it directly.", "err");
          }
        });
      }
    }

    function escapeHtml(value) {
      return String(value || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#39;");
    }

    async function loadDashboard() {
      const apiBase = String(refs.apiBase.value || "").trim().replace(/\/+$/, "");
      const readKey = String(refs.readKey.value || "").trim();
      const limit = Math.max(1, Math.min(100, Number.parseInt(String(refs.limit.value || "25"), 10) || 25));

      if (!apiBase) {
        setStatus("API base URL is required.", "err");
        return;
      }
      if (!readKey) {
        setStatus("Dashboard read key is required.", "err");
        return;
      }

      setStatus("Loading...", "");
      refs.loadBtn.disabled = true;
      refs.refreshBtn.disabled = true;

      try {
        const response = await fetch(`${apiBase}/admin/onboarding-dashboard?limit=${encodeURIComponent(String(limit))}`, {
          method: "GET",
          headers: {
            "Accept": "application/json",
            "x-dashboard-key": readKey
          }
        });

        const payload = await response.json();
        if (!response.ok || !payload?.ok) {
          throw new Error(payload?.error?.message || "Dashboard request failed.");
        }

        const data = payload.data || {};
        const users = Array.isArray(data.users) ? data.users : [];
        allUsers = users;
        renderFilteredUsers();
        refs.fetchedAt.textContent = `Last fetched: ${formatDate(data.fetchedAt)}`;
      } catch (error) {
        setStatus(error.message || "Failed to load dashboard.", "err");
      } finally {
        refs.loadBtn.disabled = false;
        refs.refreshBtn.disabled = false;
      }
    }

    async function deleteAccount({ email, companyId, button }) {
      const apiBase = String(refs.apiBase.value || "").trim().replace(/\/+$/, "");
      const readKey = String(refs.readKey.value || "").trim();
      if (!apiBase || !readKey) {
        setStatus("API base URL and dashboard key are required.", "err");
        return;
      }

      const label = email || companyId || "this account";
      const confirmed = window.confirm(`Delete ${label}? This permanently removes the account, saved answers, sessions, and saved program data.`);
      if (!confirmed) return;

      button.disabled = true;
      setStatus(`Deleting ${label}...`, "");

      try {
        const response = await fetch(`${apiBase}/admin/onboarding-dashboard/account`, {
          method: "DELETE",
          headers: {
            "Accept": "application/json",
            "Content-Type": "application/json",
            "x-dashboard-key": readKey
          },
          body: JSON.stringify({ email, companyId })
        });

        const payload = await response.json();
        if (!response.ok || !payload?.ok) {
          throw new Error(payload?.error?.message || "Delete request failed.");
        }

        setStatus(`Deleted ${label}.`, "ok");
        await loadDashboard();
      } catch (error) {
        setStatus(error.message || "Failed to delete account.", "err");
        button.disabled = false;
      }
    }

    refs.loadBtn.addEventListener("click", loadDashboard);
    refs.refreshBtn.addEventListener("click", loadDashboard);
    refs.resyncBtn.addEventListener("click", async () => {
      const apiBase = String(refs.apiBase.value || "").trim().replace(/\/+$/, "");
      const readKey = String(refs.readKey.value || "").trim();
      if (!apiBase || !readKey) {
        setStatus("API base URL and dashboard key are required.", "err");
        return;
      }
      refs.resyncBtn.disabled = true;
      setStatus("Resyncing progress data...", "");
      try {
        const response = await fetch(`${apiBase}/admin/onboarding-dashboard/resync`, {
          method: "POST",
          headers: { "Accept": "application/json", "x-dashboard-key": readKey }
        });
        const payload = await response.json();
        if (!response.ok || !payload?.ok) {
          throw new Error(payload?.error?.message || "Resync failed.");
        }
        setStatus(`Resynced ${payload.data.resynced} of ${payload.data.total} accounts. Refreshing...`, "ok");
        await loadDashboard();
      } catch (error) {
        setStatus(error.message || "Resync failed.", "err");
      } finally {
        refs.resyncBtn.disabled = false;
      }
    });
    refs.accountFilter.addEventListener("change", () => {
      renderFilteredUsers();
    });
  </script>
</body>
</html>
