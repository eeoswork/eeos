<!DOCTYPE html>
<html lang="en-US">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Onboarding Dashboard</title>
  <style>
    :root {
      --bg: #f5f7fb;
      --card: #ffffff;
      --text: #10233f;
      --muted: #5f6f86;
      --line: #dbe2ee;
      --accent: #146ef5;
      --ok: #127a4a;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: "IBM Plex Sans", "Segoe UI", Arial, sans-serif;
      background: linear-gradient(180deg, #f8fbff 0%, var(--bg) 40%, #eef2f8 100%);
      color: var(--text);
    }

    .wrap {
      max-width: 1200px;
      margin: 0 auto;
      padding: 24px;
    }

    .top {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: end;
      gap: 12px;
      margin-bottom: 16px;
    }

    h1 {
      margin: 0;
      font-size: 28px;
      letter-spacing: -0.02em;
    }

    .meta {
      color: var(--muted);
      font-size: 13px;
    }

    .panel {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 14px;
      box-shadow: 0 8px 24px rgba(16, 35, 63, 0.05);
    }

    .controls {
      display: grid;
      grid-template-columns: 1.2fr 0.8fr auto auto;
      gap: 10px;
      align-items: end;
      margin-bottom: 14px;
    }

    .field label {
      display: block;
      font-size: 12px;
      color: var(--muted);
      margin-bottom: 4px;
    }

    .field input {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 9px 10px;
      font-size: 14px;
      background: #fff;
    }

    button {
      border: 0;
      border-radius: 8px;
      padding: 10px 14px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      background: var(--accent);
      color: #fff;
    }

    button.ghost {
      background: #eaf2ff;
      color: #1a57be;
    }

    button.danger {
      background: #fff1f2;
      color: #b42318;
      border: 1px solid #fecdd3;
    }

    button:disabled {
      cursor: not-allowed;
      opacity: 0.6;
    }

    .status {
      font-size: 13px;
      margin: 8px 2px 2px;
      color: var(--muted);
      min-height: 18px;
    }

    .status.ok { color: var(--ok); }
    .status.err { color: #b42318; }

    .list {
      display: grid;
      gap: 12px;
      margin-top: 14px;
    }

    .card {
      border: 1px solid var(--line);
      border-radius: 12px;
      background: #fff;
      overflow: hidden;
    }

    .cardHead {
      padding: 12px 14px;
      background: #f2f7ff;
      border-bottom: 1px solid var(--line);
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      gap: 8px;
    }

    .email {
      font-weight: 700;
      word-break: break-all;
    }

    .small {
      color: var(--muted);
      font-size: 12px;
    }

    .headActions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .grid {
      padding: 12px 14px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
    }

    .box {
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 10px;
      background: #fcfdff;
    }

    .box h3 {
      margin: 0 0 8px;
      font-size: 13px;
      text-transform: uppercase;
      letter-spacing: 0.03em;
      color: #3a4b67;
    }

    .row {
      display: grid;
      grid-template-columns: 130px 1fr;
      gap: 8px;
      margin-bottom: 6px;
      font-size: 13px;
    }

    .key { color: var(--muted); }
    .val { color: var(--text); word-break: break-word; }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }

    th, td {
      border-bottom: 1px solid var(--line);
      text-align: left;
      padding: 6px 4px;
    }

    th { color: var(--muted); font-weight: 600; }

    .empty {
      padding: 14px;
      font-size: 13px;
      color: var(--muted);
    }

    @media (max-width: 980px) {
      .controls { grid-template-columns: 1fr; }
      .grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="top">
      <div>
        <h1>Onboarding Dashboard</h1>
        <div class="meta">Simple read-only view for onboarding answers and recommended program weeks</div>
      </div>
      <div class="meta" id="fetchedAt">Not loaded yet</div>
    </div>

    <div class="panel">
      <div class="controls">
        <div class="field">
          <label for="apiBase">API Base URL</label>
          <input id="apiBase" type="text" value="https://api.eeos.work/api" />
        </div>
        <div class="field">
          <label for="readKey">Dashboard Read Key</label>
          <input id="readKey" type="password" placeholder="Set in Cloudflare as DASHBOARD_READ_KEY" />
        </div>
        <div class="field">
          <label for="limit">Rows</label>
          <input id="limit" type="number" min="1" max="100" value="25" />
        </div>
        <button id="loadBtn" type="button">Load</button>
      </div>
      <button class="ghost" id="refreshBtn" type="button">Refresh</button>
      <div class="status" id="status"></div>
    </div>

    <div class="list" id="results"></div>
  </div>

  <script>
    const refs = {
      apiBase: document.getElementById("apiBase"),
      readKey: document.getElementById("readKey"),
      limit: document.getElementById("limit"),
      loadBtn: document.getElementById("loadBtn"),
      refreshBtn: document.getElementById("refreshBtn"),
      status: document.getElementById("status"),
      results: document.getElementById("results"),
      fetchedAt: document.getElementById("fetchedAt")
    };

    function setStatus(message, type) {
      refs.status.className = "status" + (type ? " " + type : "");
      refs.status.textContent = message;
    }

    function formatArray(value) {
      if (!Array.isArray(value) || !value.length) return "-";
      return value.join(", ");
    }

    function formatCurrency(value) {
      const amount = Number(value || 0);
      if (!amount) return "-";
      return "$" + amount.toLocaleString();
    }

    function formatDate(value) {
      const iso = String(value || "").trim();
      if (!iso) return "-";
      const d = new Date(iso);
      if (Number.isNaN(d.getTime())) return iso;
      return d.toLocaleString();
    }

    function render(users) {
      refs.results.innerHTML = "";
      if (!Array.isArray(users) || !users.length) {
        refs.results.innerHTML = '<div class="panel empty">No rows found.</div>';
        return;
      }

      for (const user of users) {
        const card = document.createElement("article");
        card.className = "card";

        const answers = user.answers || {};
        const program = Array.isArray(user.program) ? user.program : [];

        card.innerHTML = `
          <div class="cardHead">
            <div>
              <div class="email">${escapeHtml(user.email || "-")}</div>
              <div class="small">Company: ${escapeHtml(user.companyName || "-")} | Admin: ${escapeHtml(user.adminName || "-")}</div>
            </div>
            <div class="headActions">
              <div class="small">Updated: ${escapeHtml(formatDate(user.updatedAt))}</div>
              <button class="danger delete-account-btn" type="button" data-email="${escapeHtml(user.email || "")}" data-company-id="${escapeHtml(user.companyId || "")}">Delete account</button>
            </div>
          </div>
          <div class="grid">
            <section class="box">
              <h3>User Inputs</h3>
              <div class="row"><div class="key">Employees</div><div class="val">${escapeHtml(String(answers.employeeCount || "-"))}</div></div>
              <div class="row"><div class="key">Goals</div><div class="val">${escapeHtml(formatArray(answers.goals))}</div></div>
              <div class="row"><div class="key">Setting</div><div class="val">${escapeHtml(answers.setting || "-")}</div></div>
              <div class="row"><div class="key">Schedule</div><div class="val">${escapeHtml(formatArray(answers.schedule))}</div></div>
              <div class="row"><div class="key">Days</div><div class="val">${escapeHtml(formatArray(answers.daysSelected))}</div></div>
              <div class="row"><div class="key">Times</div><div class="val">${escapeHtml(formatArray(answers.timesSelected))}</div></div>
              <div class="row"><div class="key">Interests</div><div class="val">${escapeHtml(formatArray(answers.interests))}</div></div>
              <div class="row"><div class="key">Budget mode</div><div class="val">${escapeHtml(answers.budgetMode || "-")}</div></div>
              <div class="row"><div class="key">Total budget</div><div class="val">${escapeHtml(formatCurrency(answers.totalBudget))}</div></div>
              <div class="row"><div class="key">Per employee</div><div class="val">${escapeHtml(formatCurrency(answers.perEmployeeBudget))}</div></div>
            </section>
            <section class="box">
              <h3>Recommended Program</h3>
              ${program.length ? `
                <table>
                  <thead><tr><th>Week</th><th>Event name</th></tr></thead>
                  <tbody>
                    ${program.map((item) => `<tr><td>${escapeHtml(String(item.week || "-"))}</td><td>${escapeHtml(item.eventName || "-")}</td></tr>`).join("")}
                  </tbody>
                </table>
              ` : '<div class="small">No saved program rows.</div>'}
            </section>
          </div>
        `;

        refs.results.appendChild(card);
      }

      for (const button of refs.results.querySelectorAll(".delete-account-btn")) {
        button.addEventListener("click", () => {
          const email = String(button.getAttribute("data-email") || "").trim();
          const companyId = String(button.getAttribute("data-company-id") || "").trim();
          deleteAccount({ email, companyId, button });
        });
      }
    }

    function escapeHtml(value) {
      return String(value || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#39;");
    }

    async function loadDashboard() {
      const apiBase = String(refs.apiBase.value || "").trim().replace(/\/+$/, "");
      const readKey = String(refs.readKey.value || "").trim();
      const limit = Math.max(1, Math.min(100, Number.parseInt(String(refs.limit.value || "25"), 10) || 25));

      if (!apiBase) {
        setStatus("API base URL is required.", "err");
        return;
      }
      if (!readKey) {
        setStatus("Dashboard read key is required.", "err");
        return;
      }

      setStatus("Loading...", "");
      refs.loadBtn.disabled = true;
      refs.refreshBtn.disabled = true;

      try {
        const response = await fetch(`${apiBase}/admin/onboarding-dashboard?limit=${encodeURIComponent(String(limit))}`, {
          method: "GET",
          headers: {
            "Accept": "application/json",
            "x-dashboard-key": readKey
          }
        });

        const payload = await response.json();
        if (!response.ok || !payload?.ok) {
          throw new Error(payload?.error?.message || "Dashboard request failed.");
        }

        const data = payload.data || {};
        const users = Array.isArray(data.users) ? data.users : [];
        render(users);
        refs.fetchedAt.textContent = `Last fetched: ${formatDate(data.fetchedAt)}`;
        setStatus(`Loaded ${users.length} user record(s).`, "ok");
      } catch (error) {
        setStatus(error.message || "Failed to load dashboard.", "err");
      } finally {
        refs.loadBtn.disabled = false;
        refs.refreshBtn.disabled = false;
      }
    }

    async function deleteAccount({ email, companyId, button }) {
      const apiBase = String(refs.apiBase.value || "").trim().replace(/\/+$/, "");
      const readKey = String(refs.readKey.value || "").trim();
      if (!apiBase || !readKey) {
        setStatus("API base URL and dashboard key are required.", "err");
        return;
      }

      const label = email || companyId || "this account";
      const confirmed = window.confirm(`Delete ${label}? This permanently removes the account, saved answers, sessions, and saved program data.`);
      if (!confirmed) return;

      button.disabled = true;
      setStatus(`Deleting ${label}...`, "");

      try {
        const response = await fetch(`${apiBase}/admin/onboarding-dashboard/account`, {
          method: "DELETE",
          headers: {
            "Accept": "application/json",
            "Content-Type": "application/json",
            "x-dashboard-key": readKey
          },
          body: JSON.stringify({ email, companyId })
        });

        const payload = await response.json();
        if (!response.ok || !payload?.ok) {
          throw new Error(payload?.error?.message || "Delete request failed.");
        }

        setStatus(`Deleted ${label}.`, "ok");
        await loadDashboard();
      } catch (error) {
        setStatus(error.message || "Failed to delete account.", "err");
        button.disabled = false;
      }
    }

    refs.loadBtn.addEventListener("click", loadDashboard);
    refs.refreshBtn.addEventListener("click", loadDashboard);
  </script>
</body>
</html>
